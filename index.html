<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover 让棋盘能用到刘海屏的整宽；不再禁用缩放（user-scalable=no 会挡住
     视力不好的人放大，而这里并没有会被误触发的手势） -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>五子棋 Gomoku · AI</title>
<meta name="description" content="单文件五子棋 AI：威胁模式表估值、PVS + 置换表搜索、VCF/VCT 完整算杀。零依赖，打开即玩。">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="五子棋 Gomoku · AI">
<meta property="og:description" content="威胁模式表估值 · PVS + 置换表 · VCF/VCT 算杀。单文件、零依赖、打开即玩。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9a05b'/><circle cx='25' cy='25' r='12.5' fill='%23141418'/><circle cx='40' cy='40' r='12.5' fill='%23fbfbf9'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9a05b'/><circle cx='25' cy='25' r='12.5' fill='%23141418'/><circle cx='40' cy='40' r='12.5' fill='%23fbfbf9'/></svg>">
<style>
  :root{
    --fg:#f2f6fb; --dim:#a8b6c9; --dimmer:#77869a;
    --acc:#ffb340; --acc-d:#e8901a; --acc2:#6cb6ff; --good:#4ad66d; --bad:#ff6b5a;
    --wood:#dda663; --wood2:#c98b45;
    --r:20px; --r-sm:13px;

    /* 玻璃配方：亮度靠白色叠加，通透感靠 backdrop-filter，边缘靠 inset 高光。
       三个变量统一控制，改一处全局生效。 */
    /* 两层：上面是玻璃的白色反光，下面压一层暗底。背景现在很艳，靠这层暗底
       把文字对比度稳住——比拿黑纱盖住整幅背景好，颜色仍然透得出来。 */
    --glass-bg:linear-gradient(155deg,rgba(255,255,255,.17),rgba(255,255,255,.06) 55%,rgba(255,255,255,.10)),
               linear-gradient(0deg,rgba(7,11,19,.46),rgba(7,11,19,.46));
    --glass-blur:blur(30px) saturate(190%) brightness(1.08);
    --glass-edge:
      inset 0 1.5px 0 rgba(255,255,255,.55),    /* 顶缘接光——最能让人认出是玻璃的一笔 */
      inset 0 -1px 0 rgba(255,255,255,.12),     /* 底缘微反射 */
      inset 1px 0 0 rgba(255,255,255,.14),
      inset -1px 0 0 rgba(255,255,255,.14);
    --glass-drop:0 10px 34px rgba(0,0,0,.42);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;position:relative;isolation:isolate;
    background:#070a10;
    color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Microsoft YaHei","Helvetica Neue",Segoe UI,system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(12px,3vw,22px) 12px calc(28px + env(safe-area-inset-bottom));
    gap:16px;-webkit-font-smoothing:antialiased;
  }
  /* 水粉背景：玻璃背后必须有东西可透，否则只是「亮一点的方块」。
     用一张低分辨率画布画柔和色团，再由浏览器双线性放大到全屏——放大本身就把色团
     揉成了水粉那种没有硬边的过渡，比十几个 CSS 渐变便宜得多，也才有条件做动态。
     颜色由胜率驱动：AI 占优则暖色地盘变大，你占优则冷色变大，交界处两色互相渗透。 */
  #bg{
    position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;
    display:block;
  }
  /* 压暗一层，保证玻璃上的文字始终够对比度——光斑再亮也不会糊掉正文 */
  body::after{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,8,14,.16),rgba(5,8,14,.26));
  }

  /* ---------- 玻璃基类 ---------- */
  .glass{
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:var(--glass-edge),var(--glass-drop);
    border-radius:var(--r);
    position:relative;overflow:hidden;
  }
  /* 顶缘再压一道更亮更窄的高光线，模拟玻璃厚度边被照亮 */
  .glass::after{
    content:'';position:absolute;left:12%;right:12%;top:0;height:1px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  }
  /* 斜向高光：玻璃表面的镜面反射 */
  .glass::before{
    content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(118deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.09) 20%,
               transparent 40%,transparent 100%);
  }
  /* 不支持 backdrop-filter 的浏览器退回实心，不然会变成一片糊看不清字 */
  @supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){
    .glass{background:#161c27;border-color:#2a3444}
    .glass::before{display:none}
  }

  /* ---------- 头部 ---------- */
  header{width:100%;max-width:1120px;display:flex;align-items:center;gap:12px;
    justify-content:space-between;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  h1{font-size:clamp(17px,2.4vw,21px);font-weight:680;letter-spacing:.4px;white-space:nowrap;
    text-shadow:0 2px 12px rgba(0,0,0,.5)}
  h1 span{color:var(--acc)}
  .sub{color:var(--dim);font-size:12px;letter-spacing:.2px}
  .langbtn{
    color:var(--fg);border-radius:999px;padding:6px 15px;font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:.18s;flex:0 0 auto;
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 14px rgba(0,0,0,.3);
  }
  .langbtn:hover{background:linear-gradient(155deg,rgba(255,255,255,.19),rgba(255,255,255,.08));
    border-color:rgba(255,255,255,.28)}

  /* ---------- 胜率条 ---------- */
  .wbox{width:100%;max-width:1120px;display:flex;flex-direction:column;gap:7px;transition:opacity .25s}
  .wbox.busy{opacity:.5}
  .wbrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--dim)}
  .wbl{display:flex;align-items:center;gap:7px;min-width:0}
  .wbl b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px;min-width:44px;
    text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .wbl:last-child b{text-align:right}
  .sq{width:9px;height:9px;border-radius:2.5px;display:inline-block;flex:0 0 auto}
  .sq.ai{background:var(--acc);box-shadow:0 0 10px rgba(255,179,64,.7)}
  .sq.me{background:var(--acc2);box-shadow:0 0 10px rgba(108,182,255,.7)}
  .wbnote{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;opacity:.72;
    white-space:nowrap;padding:0 8px}
  .wb{height:11px;border-radius:7px;overflow:hidden;position:relative;
      background:linear-gradient(180deg,rgba(108,182,255,.92),rgba(74,150,235,.92));
      border:1px solid rgba(255,255,255,.16);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 14px rgba(0,0,0,.38)}
  #wbFill{height:100%;width:50%;border-radius:6px 0 0 6px;
      background:linear-gradient(180deg,var(--acc),#ef8f36);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
      transition:width .55s cubic-bezier(.4,0,.2,1)}

  /* ---------- 主区 ---------- */
  .wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;
    justify-content:center;width:100%;max-width:1120px}
  .boardcol{display:flex;flex-direction:column;gap:12px;flex:0 0 auto;max-width:100%}

  /* 棋盘本身保持不透明——落子要看得清楚，这里不做玻璃，只给外框玻璃质感的边和光 */
  .boardbox{
    position:relative;border-radius:var(--r);overflow:hidden;flex:0 0 auto;max-width:100%;
    background:linear-gradient(160deg,var(--wood),var(--wood2));
    border:1px solid rgba(255,255,255,.2);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      0 18px 46px rgba(0,0,0,.5),
      0 0 0 1px rgba(0,0,0,.3);
  }
  canvas{display:block;touch-action:manipulation;cursor:pointer;max-width:100%}
  .overlay{
    position:absolute;inset:0;display:none;place-items:center;
    background:rgba(6,9,14,.42);
    backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
    animation:fade .3s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay.on{display:grid}
  .ocard{text-align:center;padding:26px 34px;border-radius:var(--r);
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:var(--glass-edge),0 16px 44px rgba(0,0,0,.5);
    animation:pop .32s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .ocard h2{font-size:24px;margin-bottom:6px;font-weight:680;text-shadow:0 2px 14px rgba(0,0,0,.5)}
  .ocard p{color:var(--dim);font-size:13px;margin-bottom:16px}

  /* ---------- 侧栏 ---------- */
  .panel{flex:1 1 310px;min-width:290px;max-width:370px;display:flex;flex-direction:column;gap:12px}
  .card{padding:14px 16px}
  .card h3{font-size:11px;color:var(--dim);font-weight:650;letter-spacing:1.2px;
    margin-bottom:11px;text-transform:uppercase}

  details.card{padding:0}
  details.card>summary{
    list-style:none;cursor:pointer;padding:14px 16px;display:flex;
    align-items:center;justify-content:space-between;gap:8px;
    font-size:11px;color:var(--dim);font-weight:650;letter-spacing:1.2px;text-transform:uppercase;
    user-select:none;-webkit-user-select:none;border-radius:var(--r);position:relative;z-index:1;
  }
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary:hover{color:var(--fg)}
  details.card>summary::after{content:'▸';font-size:12px;opacity:.8;
    transition:transform .34s cubic-bezier(.34,1.4,.5,1)}
  details.card[open]>summary::after{transform:rotate(90deg)}
  details.card>.body{padding:0 16px 15px;position:relative;z-index:1}

  .status{display:flex;align-items:center;gap:11px;font-size:15.5px;font-weight:650;
    position:relative;z-index:1}
  .dot{width:15px;height:15px;border-radius:50%;flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(255,255,255,.28) inset,0 2px 8px rgba(0,0,0,.4)}
  .dot.b{background:linear-gradient(145deg,#5b5b63,#000)}
  .dot.w{background:linear-gradient(145deg,#fff,#c4c4c0)}
  .thinking{color:var(--acc);font-size:12px;margin-top:7px;min-height:18px;
    font-variant-numeric:tabular-nums;position:relative;z-index:1}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
  .row:first-child{margin-top:0} .row:last-child{margin-bottom:0}
  .row label{color:var(--dim);font-size:13px;min-width:0}
  select,input[type=range]{
    color:var(--fg);border:1px solid rgba(255,255,255,.14);
    border-radius:var(--r-sm);padding:7px 10px;font-size:13px;outline:none;font-family:inherit;
    background:rgba(255,255,255,.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
  }
  select{cursor:pointer;min-width:126px}
  select option{background:#141a24;color:var(--fg)}   /* 下拉展开项不继承半透明，否则不可读 */
  select:focus-visible,button:focus-visible,.sw:focus-visible,summary:focus-visible{
    outline:2px solid var(--acc2);outline-offset:2px}
  input[type=range]{padding:0;width:128px;accent-color:var(--acc);cursor:pointer;box-shadow:none}
  .sw{position:relative;width:44px;height:24px;border-radius:13px;cursor:pointer;flex:0 0 auto;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
    transition:background .28s ease,border-color .28s ease,box-shadow .28s ease}
  /* 旋钮走 transform 而不是 left：这样「按下拉长」改宽度时不会把位移一起顶歪 */
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:linear-gradient(180deg,#fff,#c9d2de);box-shadow:0 2px 6px rgba(0,0,0,.45);
    transition:transform .38s cubic-bezier(.34,1.42,.5,1),width .22s ease}
  .sw.on{background:linear-gradient(180deg,rgba(255,179,64,.9),rgba(232,144,26,.9));
    border-color:rgba(255,200,120,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 18px rgba(255,179,64,.4)}
  .sw.on::after{transform:translateX(20px)}
  .sw:active::after{width:23px}
  .sw.on:active::after{transform:translateX(15px);width:23px}

  .btns{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;position:relative;z-index:1}
  button{
    color:var(--fg);border-radius:var(--r-sm);padding:11px 12px;font-size:13px;cursor:pointer;
    transition:.16s;font-family:inherit;font-weight:550;position:relative;overflow:hidden;
    background:linear-gradient(155deg,rgba(255,255,255,.19),rgba(255,255,255,.08)),
               linear-gradient(0deg,rgba(7,11,19,.34),rgba(7,11,19,.34));
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.28);
  }
  button:hover:not(:disabled){background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
    border-color:rgba(255,255,255,.26)}
  button:active:not(:disabled){transform:translateY(1px) scale(.976)}
  /* 点击涟漪：以按下点为圆心扩散。--rx/--ry 由 JS 在 pointerdown 时写入 */
  button::after{
    content:'';position:absolute;left:var(--rx,50%);top:var(--ry,50%);
    width:0;height:0;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,0) 68%);
    opacity:0;pointer-events:none;
  }
  button.rip::after{animation:ripple .58s cubic-bezier(.22,.7,.3,1)}
  @keyframes ripple{
    0%  {width:0;height:0;opacity:.75}
    100%{width:300px;height:300px;opacity:0}
  }
  button.pri::after{background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 68%)}
  button:disabled{opacity:.32;cursor:not-allowed}
  button.pri{
    background:linear-gradient(180deg,rgba(255,190,80,.95),rgba(224,140,20,.95));
    color:#241703;border-color:rgba(255,214,150,.55);font-weight:700;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 18px rgba(255,160,40,.3);
  }
  button.pri:hover:not(:disabled){background:linear-gradient(180deg,#ffc65a,#f0a125)}

  .stats{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  .stats b{color:var(--fg);font-weight:600;text-align:right;word-break:break-word}

  .moves{max-height:132px;overflow:auto;font-size:11.5px;color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.75;word-break:break-all;
    overscroll-behavior:contain}
  .moves i{color:var(--fg);font-style:normal}

  .tip{font-size:11.5px;color:var(--dim);line-height:1.75;position:relative;z-index:1}
  .tip code{background:rgba(255,255,255,.10);padding:1.5px 6px;border-radius:5px;color:var(--acc);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    border:1px solid rgba(255,255,255,.09)}
  .tip b{color:var(--fg);font-weight:600}

  /* ---------- 窄屏 ---------- */
  @media(max-width:820px){
    body{gap:13px}
    .wrap{gap:13px}
    .panel{max-width:none;flex-basis:100%;width:100%}
    .wbnote{display:none}
    header{flex-wrap:nowrap;align-items:flex-start}
    .brand{flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
    .sub{font-size:11.5px}
    #statusCard{order:1} #btnCard{order:2} #setCard{order:3}
    #anaCard{order:4} #movesCard{order:5} #tipCard{order:6}
    /* 手机 GPU 上多层 backdrop-filter 会掉帧，降模糊半径 */
    :root{--glass-blur:blur(18px) saturate(165%)}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<noscript>
  <div style="max-width:640px;margin:14px auto;padding:14px 16px;border-radius:12px;
              background:#3a2408;border:1px solid #7a5210;color:#ffd79a;font-size:13px;line-height:1.7">
    这个页面的棋盘与 AI 全部由 JavaScript 驱动，当前环境没有执行脚本，所以棋盘是空的。<br>
    常见原因：用 iOS「文件」App 的预览打开——它只渲染 HTML/CSS，不跑脚本。
    请改用浏览器打开（或把页面托管后访问其网址）。
  </div>
</noscript>

<header>
  <div class="brand">
    <h1><span>●</span> <span data-i18n="title">五子棋</span></h1>
    <div class="sub" data-i18n="subtitle">威胁模式表 · PVS+置换表 · VCF/VCT 算杀</div>
  </div>
  <button class="langbtn" id="langBtn" type="button">EN</button>
</header>

<div class="wbox" id="wbox">
  <div class="wbrow">
    <span class="wbl"><i class="sq ai"></i><span id="wbAiName">AI</span> <b id="wbAi">50%</b></span>
    <span class="wbnote" id="wbNote">胜率</span>
    <span class="wbl"><b id="wbMe">50%</b> <span id="wbMeName">你</span><i class="sq me"></i></span>
  </div>
  <div class="wb"><div id="wbFill"></div></div>
</div>

<div class="wrap">
  <div class="boardcol">
    <div class="boardbox">
      <canvas id="cv" width="560" height="560"></canvas>
      <div class="overlay" id="ov">
        <div class="ocard">
          <h2 id="ovt">—</h2>
          <p id="ovs">—</p>
          <button class="pri" onclick="newGame()" data-i18n="playAgain">再来一局</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="card glass" id="statusCard">
      <div class="status"><span class="dot b" id="turnDot"></span><span id="turnTxt">黑方落子</span></div>
      <div class="thinking" id="think">&nbsp;</div>
    </div>

    <details class="card glass" id="setCard" open>
      <summary data-i18n="settings">对局设置</summary>
      <div class="body">
        <div class="row"><label for="level" data-i18n="difficulty">难度</label>
          <select id="level">
            <option value="1" data-i18n="lv1">入门</option>
            <option value="2" data-i18n="lv2">普通</option>
            <option value="3" data-i18n="lv3">困难</option>
            <option value="4" data-i18n="lv4">大师</option>
            <option value="5" selected data-i18n="lv5">地狱（最强）</option>
          </select>
        </div>
        <div class="row"><label for="side" data-i18n="mySide">我执</label>
          <select id="side">
            <option value="1" selected data-i18n="sideBlack">黑（先手）</option>
            <option value="2" data-i18n="sideWhite">白（后手）</option>
          </select>
        </div>
        <div class="row"><label for="time"><span data-i18n="thinkTime">思考时长</span>
          <b id="tval" style="color:var(--fg)">9.0s</b></label>
          <input type="range" id="time" min="1" max="20" step="1" value="9">
        </div>
        <div class="row"><label data-i18n="forbidRule">黑方禁手规则</label>
          <div class="sw" id="forbid" role="switch" tabindex="0" aria-checked="false"></div></div>
        <div class="row"><label data-i18n="showNums">显示手数</label>
          <div class="sw on" id="nums" role="switch" tabindex="0" aria-checked="true"></div></div>

        <span data-i18n="tipBody">地狱难度下 AI 会做完整的<b>连四杀（VCF）</b>、<b>连续威胁杀（VCT，含四三/双三）</b>与<b>杀棋规避</b>校验；

<!-- ==================== 引擎源码（Worker / 主线程共用） ==================== -->
<script id="engineSrc" type="text/plain">
'use strict';
/* ---------- 基本常量 ---------- */
var N=15, PAD=4, W=N+2*PAD, WW=W*W;
var EMPTY=0, BLACK=1, WHITE=2, OUT=3;
var D=[1,W,W+1,W-1];
var OFF=[-4,-3,-2,-1,1,2,3,4];

/* 棋型等级 */
var P_NONE=0,P_TWO=1,P_OTWO=2,P_STHREE=3,P_OTHREE=4,P_FOUR=5,P_OFOUR=6,P_FIVE=7;
var PSCORE=new Int32Array([0,2,14,20,220,240,3000,20000]);

/* 点位综合分（用于走法排序 / 威胁判定） */
var SC_FIVE=10000000, SC_OFOUR=1000000, SC_44=500000, SC_43=450000, SC_33=100000;
var WIN=9000000, NEARWIN=800000, INF=99999999;

/* ---------- 棋型查表：4^8 邻域编码 -> 棋型等级 ---------- */
var POW3=[1,3,9,27,81,243,729,2187];
var PAT_B=new Int8Array(65536), PAT_W=new Int8Array(65536);

(function buildTables(){
  var L1=new Int8Array(6561), L2=new Int8Array(6561), L3=new Int8Array(6561), L=new Int8Array(6561);
  var cells=new Int8Array(9);
  function dec(key){
    var k=key,i,pos;
    for(i=0;i<8;i++){ pos=i<4?i:i+1; cells[pos]=k%3; k=(k/3)|0; }
    cells[4]=1;
  }
  function hasFive(){
    for(var s=0;s<5;s++){
      var ok=1;
      for(var i=s;i<s+5;i++){ if(cells[i]!==1){ok=0;break;} }
      if(ok) return true;
    }
    return false;
  }
  function winCnt(){
    var n=0;
    for(var e=0;e<9;e++){
      if(cells[e]!==0) continue;
      cells[e]=1; if(hasFive()) n++; cells[e]=0;
    }
    return n;
  }
  var key,i,d,ck,t;
  /* L1：五 / 活四 / 冲四 */
  for(key=0;key<6561;key++){
    dec(key);
    if(hasFive()) L1[key]=P_FIVE;
    else{ var w=winCnt(); L1[key]= w>=2?P_OFOUR : (w===1?P_FOUR:P_NONE); }
  }
  /* L2：再落一子能成活四 -> 活三；能成冲四 -> 眠三 */
  for(key=0;key<6561;key++){
    if(L1[key]!==P_NONE) continue;
    var best=P_NONE;
    for(i=0;i<8;i++){
      d=((key/POW3[i])|0)%3; if(d!==0) continue;
      ck=key+POW3[i]; t=L1[ck];
      if(t===P_OFOUR){ best=P_OTHREE; break; }
      if(t===P_FOUR && best===P_NONE) best=P_STHREE;
    }
    L2[key]=best;
  }
  /* L3：再落一子能成活三 -> 活二；能成眠三 -> 眠二 */
  for(key=0;key<6561;key++){
    if(L1[key]!==P_NONE||L2[key]!==P_NONE) continue;
    var b2=P_NONE;
    for(i=0;i<8;i++){
      d=((key/POW3[i])|0)%3; if(d!==0) continue;
      ck=key+POW3[i]; t=L2[ck];
      if(t===P_OTHREE){ b2=P_OTWO; break; }
      if(t===P_STHREE && b2===P_NONE) b2=P_TWO;
    }
    L3[key]=b2;
  }
  for(key=0;key<6561;key++) L[key]= L1[key]||L2[key]||L3[key];

  for(var code=0;code<65536;code++){
    var kb=0,kw=0,v;
    for(i=0;i<8;i++){
      v=(code>>(2*i))&3;
      kb += (v===0?0:(v===1?1:2))*POW3[i];
      kw += (v===0?0:(v===2?1:2))*POW3[i];
    }
    PAT_B[code]=L[kb]; PAT_W[code]=L[kw];
  }
})();

/* ---------- 棋盘状态 ---------- */
var board=new Int8Array(WW);
var PB=new Int8Array(WW*4), PW=new Int8Array(WW*4);
var SB=new Int32Array(WW), SW=new Int32Array(WW);
var adj=new Int8Array(WW);
var POSB=new Int32Array(WW);
var totB=0, totW=0, stones=0;
var CELLS=new Int32Array(225);
var NB=[];
var Z1=new Int32Array(WW*3), Z2=new Int32Array(WW*3);
var hash1=0, hash2=0;
var FORBID=false;

(function init(){
  var c=0,x,y,dx,dy,p;
  for(y=0;y<N;y++) for(x=0;x<N;x++){
    p=(y+PAD)*W+(x+PAD); CELLS[c++]=p;
    POSB[p]=(14-(Math.abs(x-7)+Math.abs(y-7)))*3;
  }
  for(dy=-2;dy<=2;dy++) for(dx=-2;dx<=2;dx++) if(dx||dy) NB.push(dy*W+dx);
  var s1=88172645463325252, r=1234567891;
  function rnd(){ r^=r<<13; r^=r>>>17; r^=r<<5; return r|0; }
  for(var i=0;i<WW*3;i++){ Z1[i]=rnd(); Z2[i]=rnd(); }
})();

function reset(){
  board.fill(OUT);
  for(var i=0;i<225;i++) board[CELLS[i]]=EMPTY;
  PB.fill(0); PW.fill(0); SB.fill(0); SW.fill(0); adj.fill(0);
  totB=0; totW=0; stones=0; hash1=0; hash2=0;
}

function codeAt(p,d){
  return board[p-4*d]|(board[p-3*d]<<2)|(board[p-2*d]<<4)|(board[p-d]<<6)
       |(board[p+d]<<8)|(board[p+2*d]<<10)|(board[p+3*d]<<12)|(board[p+4*d]<<14);
}
function touch(q,k){
  var i=q*4+k;
  totB-=PSCORE[PB[i]]; totW-=PSCORE[PW[i]];
  var c=codeAt(q,D[k]), a=PAT_B[c], b=PAT_W[c];
  PB[i]=a; PW[i]=b;
  totB+=PSCORE[a]; totW+=PSCORE[b];
  recomb(q);
}
/* 把一个空点四个方向的棋型合成为综合威胁分，增量维护，供走法生成直接读取 */
function recomb(q){
  var b=q*4,k,t,s,five,of,fo,ot;
  s=0;five=0;of=0;fo=0;ot=0;
  for(k=0;k<4;k++){ t=PB[b+k]; s+=PSCORE[t];
    if(t===P_FIVE)five++; else if(t===P_OFOUR)of++; else if(t===P_FOUR)fo++; else if(t===P_OTHREE)ot++; }
  SB[q]= five?SC_FIVE:(of?SC_OFOUR:(fo>=2?SC_44:((fo&&ot)?SC_43:(ot>=2?SC_33:s))));
  s=0;five=0;of=0;fo=0;ot=0;
  for(k=0;k<4;k++){ t=PW[b+k]; s+=PSCORE[t];
    if(t===P_FIVE)five++; else if(t===P_OFOUR)of++; else if(t===P_FOUR)fo++; else if(t===P_OTHREE)ot++; }
  SW[q]= five?SC_FIVE:(of?SC_OFOUR:(fo>=2?SC_44:((fo&&ot)?SC_43:(ot>=2?SC_33:s))));
}
function make(p,col){
  var k,j,d,q,i;
  for(k=0;k<4;k++){ i=p*4+k; totB-=PSCORE[PB[i]]; totW-=PSCORE[PW[i]]; PB[i]=0; PW[i]=0; }
  SB[p]=0; SW[p]=0;
  board[p]=col;
  for(k=0;k<4;k++){ d=D[k];
    for(j=0;j<8;j++){ q=p+OFF[j]*d; if(board[q]===EMPTY) touch(q,k); } }
  for(j=0;j<24;j++) adj[p+NB[j]]++;
  hash1^=Z1[p*3+col]; hash2^=Z2[p*3+col]; stones++;
}
function unmake(p,col){
  var k,j,d,q;
  board[p]=EMPTY;
  for(k=0;k<4;k++){ d=D[k];
    for(j=0;j<8;j++){ q=p+OFF[j]*d; if(board[q]===EMPTY) touch(q,k); } }
  for(k=0;k<4;k++) touch(p,k);
  for(j=0;j<24;j++) adj[p+NB[j]]--;
  hash1^=Z1[p*3+col]; hash2^=Z2[p*3+col]; stones--;
}

/* ---------- 点位评分 ---------- */
function pointScoreArr(P,q){
  var b=q*4, s=0, five=0, of=0, fo=0, ot=0, t, k;
  for(k=0;k<4;k++){
    t=P[b+k]; s+=PSCORE[t];
    if(t===P_FIVE) five++;
    else if(t===P_OFOUR) of++;
    else if(t===P_FOUR) fo++;
    else if(t===P_OTHREE) ot++;
  }
  if(five) return SC_FIVE;
  if(of) return SC_OFOUR;
  if(fo>=2) return SC_44;
  if(fo&&ot) return SC_43;
  if(ot>=2) return SC_33;
  return s;
}
function runLenAt(q,d,c){
  var n=1,p=q-d;
  while(board[p]===c){n++;p-=d;}
  p=q+d; while(board[p]===c){n++;p+=d;}
  return n;
}
/* 黑方禁手（近似标准规则：长连 / 四四 / 三三；成五优先） */
function isForbidden(q){
  var b=q*4,k,t,exact=0,lng=0,four=0,ot=0;
  for(k=0;k<4;k++){
    t=PB[b+k];
    if(t===P_FIVE){ if(runLenAt(q,D[k],BLACK)===5) exact++; else lng++; }
    else if(t===P_OFOUR||t===P_FOUR) four++;
    else if(t===P_OTHREE) ot++;
  }
  if(exact) return false;
  if(lng) return true;
  if(four>=2) return true;
  if(ot>=2) return true;
  return false;
}
function makesFive(c,q){
  var P=c===BLACK?PB:PW, b=q*4, k;
  for(k=0;k<4;k++){
    if(P[b+k]===P_FIVE){
      if(FORBID&&c===BLACK){ if(runLenAt(q,D[k],BLACK)===5) return true; }
      else return true;
    }
  }
  return false;
}
var fpBuf=new Int32Array(8);
function fivePoints(c,limit){
  var n=0,i,q;
  for(i=0;i<225;i++){
    q=CELLS[i];
    if(board[q]!==EMPTY||adj[q]===0) continue;
    if((c===BLACK?SB:SW)[q]<SC_FIVE) continue;
    if(makesFive(c,q)){ fpBuf[n++]=q; if(n>=limit) break; }
  }
  return n;
}

/* ---------- 走法生成 ---------- */
var MAXPLY=48, SLOT=80;
var mvBuf=new Int32Array(MAXPLY*SLOT), scBuf=new Int32Array(MAXPLY*SLOT), fcBuf=new Uint8Array(MAXPLY*SLOT);
var killers=new Int32Array(MAXPLY*2);
var history=new Int32Array(3*WW);
var genFlag=0, genMyMax=0, genOppMax=0;

function maxCandFor(d){ return d>=8?16:(d>=6?14:(d>=4?12:(d>=2?10:8))); }

function genMoves(side, ply, ttMv, maxCand){
  var opp=3-side, base=ply*SLOT;
  var PS=side===BLACK?PB:PW, PO=side===BLACK?PW:PB;
  var n=0,i,q,sm,so,sc,anyEmpty=0,oppFiveCnt=0,oppFiveP=-1;
  var hb=side*WW;
  genFlag=0; genMyMax=0; genOppMax=0;

  for(i=0;i<225;i++){
    q=CELLS[i];
    if(board[q]!==EMPTY||adj[q]===0) continue;
    anyEmpty=1;
    so=(opp===BLACK?SB:SW)[q];
    if(so>=SC_FIVE){
      if(FORBID && opp===BLACK && !makesFive(BLACK,q)) so=SC_44;
      else { oppFiveCnt++; oppFiveP=q; }
    }
    if(so>genOppMax) genOppMax=so;

    if(FORBID && side===BLACK && isForbidden(q)) continue;
    sm=(side===BLACK?SB:SW)[q];
    if(sm>=SC_FIVE){ mvBuf[base]=q; genFlag=1; genMyMax=sm; return 1; }
    if(sm>genMyMax) genMyMax=sm;

    sc = sm + ((so*3)>>2) + POSB[q] + (history[hb+q]>>6);
    if(q===ttMv) sc+=8000000;
    else if(q===killers[ply*2]||q===killers[ply*2+1]) sc+=60000;
    if(n<SLOT){
      mvBuf[base+n]=q; scBuf[base+n]=sc;
      fcBuf[base+n]= sm>=SC_43?2:((sm>=SC_33||so>=SC_33)?1:0);
      n++;
    }
  }
  if(oppFiveCnt>=2){ genFlag=2; return 0; }
  if(oppFiveCnt===1){
    if(FORBID && side===BLACK && isForbidden(oppFiveP)){ genFlag=2; return 0; }
    mvBuf[base]=oppFiveP; fcBuf[base]=2; return 1;
  }
  if(n===0){ genFlag= anyEmpty?3:0; return 0; }

  var lim=n<maxCand?n:maxCand, bi,bs,j,t;
  for(i=0;i<lim;i++){
    bi=i; bs=scBuf[base+i];
    for(j=i+1;j<n;j++){ if(scBuf[base+j]>bs){ bs=scBuf[base+j]; bi=j; } }
    if(bi!==i){
      t=mvBuf[base+i]; mvBuf[base+i]=mvBuf[base+bi]; mvBuf[base+bi]=t;
      t=scBuf[base+i]; scBuf[base+i]=scBuf[base+bi]; scBuf[base+bi]=t;
      t=fcBuf[base+i]; fcBuf[base+i]=fcBuf[base+bi]; fcBuf[base+bi]=t;
    }
  }
  return lim;
}

function evaluate(side){
  var v = side===BLACK ? (totB-((totW*11/10)|0)) : (totW-((totB*11/10)|0));
  return v|0;
}

/* ---------- 置换表 ---------- */
var TT_BITS=20, TT_SIZE=1<<TT_BITS, TT_MASK=TT_SIZE-1;
/* 杀棋分的分界线。杀棋分是 WIN-ply（ply<=MAXPLY=48），所以真杀棋分落在 [WIN-48, WIN]；
   NEARWIN 那档启发分只有 80 万量级，离得很远，这条线不会误伤。 */
var MATE_BAND=WIN-1000;
var ttKey=new Int32Array(TT_SIZE), ttVal=new Int32Array(TT_SIZE);
var ttDepth=new Int8Array(TT_SIZE), ttFlag=new Int8Array(TT_SIZE);
var ttSide=new Int8Array(TT_SIZE), ttMove=new Int32Array(TT_SIZE);
function ttClear(){ ttSide.fill(0); vctTtClear(); }
function ttIndex(side){ return (hash1^(side===BLACK?0:0x5bf03635))&TT_MASK; }

/* ---------- 主搜索 ---------- */
var nodeCount=0, deadline=0, timeout=0;
function nowMs(){ return performance.now(); }

function pvs(side, depth, alpha, beta, ply){
  nodeCount++;
  if((nodeCount&1023)===0 && nowMs()>deadline){ timeout=1; return 0; }
  if(ply>=MAXPLY-2) return evaluate(side);

  var opp=3-side, base=ply*SLOT, alphaOrig=alpha, ttMv=0;
  var ti=ttIndex(side);
  if(ttSide[ti]===side && ttKey[ti]===hash2){
    ttMv=ttMove[ti];
    if(ttDepth[ti]>=depth){
      var tv=ttVal[ti], tf=ttFlag[ti];
      /* 存的是「距这个节点还有几步将杀」，取出来要换算回「从根数第几层将杀」 */
      if(tv>=MATE_BAND) tv-=ply; else if(tv<=-MATE_BAND) tv+=ply;
      if(tf===0) return tv;
      else if(tf===1){ if(tv>alpha) alpha=tv; }
      else { if(tv<beta) beta=tv; }
      if(alpha>=beta) return tv;
    }
  }

  var cnt=genMoves(side, ply, ttMv, maxCandFor(depth));
  if(genFlag===1) return WIN-ply;
  if(genFlag===2) return -(WIN-ply-1);
  if(genFlag===3) return -(WIN-ply);
  if(cnt===0) return 0;

  if(depth<=0){
    var e;
    if(genMyMax>=SC_44 && genOppMax<SC_FIVE) e=NEARWIN-ply;
    else{
      var a=genMyMax>200000?200000:genMyMax, b=genOppMax>200000?200000:genOppMax;
      e=evaluate(side)+((a/6-b/5)|0);
      if(e>300000) e=300000; else if(e<-300000) e=-300000;
    }
    return e;
  }

  var best=-INF, bestMv=mvBuf[base], i,q,fc,ext,nd,red,v;
  for(i=0;i<cnt;i++){
    q=mvBuf[base+i]; fc=fcBuf[base+i];
    ext = (fc===2 && ply+depth<34)?1:0;
    nd = depth-1+ext;
    make(q,side);
    if(i===0){
      v=-pvs(opp,nd,-beta,-alpha,ply+1);
    }else{
      red = (!fc && depth>=4 && i>=6)?1:0;
      v=-pvs(opp,nd-red,-alpha-1,-alpha,ply+1);
      if(!timeout && red && v>alpha) v=-pvs(opp,nd,-alpha-1,-alpha,ply+1);
      if(!timeout && v>alpha && v<beta) v=-pvs(opp,nd,-beta,-alpha,ply+1);
    }
    unmake(q,side);
    if(timeout) return 0;
    if(v>best){
      best=v; bestMv=q;
      if(v>alpha){
        alpha=v;
        if(alpha>=beta){
          killers[ply*2+1]=killers[ply*2]; killers[ply*2]=q;
          history[side*WW+q]+=depth*depth;
          break;
        }
      }
    }
  }
  ti=ttIndex(side);
  /* 杀棋分要按 ply 校正后再存：best 里的 WIN-ply 是「从根数第几层将杀」，
     换根或同一局面出现在别的 ply 时就失真了。加上 ply 转成节点相对的「还有几步将杀」，
     读表时再减回去。实测这个 bug 真的会发生（LV5 两局里 267 次取回错误的杀棋距离，
     最差错 10 步），但错的杀棋分仍然压过一切非杀棋分，选出来还是同一步——
     LV3/LV4 六个开局逐字节验证过是空操作。**这是正确性修复，不是棋力提升**：
     配套的「ply 校正 + TT 跨步保留」预登记跑了 200 局，98:99，−2 Elo。 */
  var sv=best;
  if(sv>=MATE_BAND) sv+=ply; else if(sv<=-MATE_BAND) sv-=ply;
  ttKey[ti]=hash2; ttSide[ti]=side; ttVal[ti]=sv; ttDepth[ti]=depth>127?127:depth;
  ttFlag[ti]= best<=alphaOrig?2:(best>=beta?1:0); ttMove[ti]=bestMv;
  return best;
}

/* ---------- VCF：连续冲四取胜（严格算杀，无假算） ---------- */
var vcfNodes=0, vcfLimit=0, vcfDeadline=0;
function vcf(side, depth){
  if(++vcfNodes>vcfLimit) return 0;
  if((vcfNodes&255)===0 && nowMs()>vcfDeadline) return 0;
  var opp=3-side,i,q;
  if(fivePoints(side,1)>0) return fpBuf[0];
  if(depth<=0) return 0;
  if(fivePoints(opp,1)>0) return 0;

  var P=side===BLACK?PB:PW;
  var list=[], sc=[];
  for(i=0;i<225;i++){
    q=CELLS[i];
    if(board[q]!==EMPTY||adj[q]===0) continue;
    var b=q*4,k,isFour=0;
    for(k=0;k<4;k++){ var t=P[b+k]; if(t===P_FOUR||t===P_OFOUR){ isFour=1; break; } }
    if(!isFour) continue;
    if(FORBID && side===BLACK && isForbidden(q)) continue;
    list.push(q); sc.push((side===BLACK?SB:SW)[q]);
  }
  for(i=1;i<list.length;i++){
    var mq=list[i], ms=sc[i], j=i-1;
    while(j>=0&&sc[j]<ms){ list[j+1]=list[j]; sc[j+1]=sc[j]; j--; }
    list[j+1]=mq; sc[j+1]=ms;
  }

  for(i=0;i<list.length;i++){
    q=list[i];
    make(q,side);
    var res=0;
    var wn=fivePoints(side,2);
    if(wn>=2) res=q;
    else if(wn===1){
      var dpt=fpBuf[0];
      var on=fivePoints(opp,2), ok=1;
      if(on>0 && !(on===1 && fpBuf[0]===dpt)) ok=0;
      if(ok){
        if(FORBID && opp===BLACK && isForbidden(dpt)) res=q;
        else{
          make(dpt,opp);
          var r=vcf(side,depth-1);
          unmake(dpt,opp);
          if(r) res=q;
        }
      }
    }
    unmake(q,side);
    if(res) return res;
    if(vcfNodes>vcfLimit||nowMs()>vcfDeadline) return 0;
  }
  return 0;
}

/* ---------- VCT：连续威胁算杀（冲四 + 活三混合，能找到四三杀/双三杀） ----------
   可靠性依据：进攻方只走强制着法，所以防守方若不理会威胁、又没做出冲四，
   下一手就会被做成活四。因此「我方威胁线上的点 ∪ 对方的冲四点」是完备防守集，
   不是随便取几个候选——取不全就会算出假杀。 */
var vctNodes=0, vctLimit=0, vctDeadline=0;
var atkBuf=new Int32Array(32*64), atkSc=new Int32Array(32*64);
var defBuf=new Int32Array(32*32);
var patSave=new Int8Array(32*4);   // 落子前的棋型快照：落子后该点棋型会被清零，必须先存

/* ---------- VCT 置换表（只加在 vct() 上；VCF 占算杀节点仅 0.3%，加了白写，见 PROGRESS） ----------
   置换率实测 86%（scratchpad/probe_tt.js），LV4 出厂配置 A/B 24 局 9:15 净胜（scratchpad/ab_vcttt.js）。
   深度字段照旧存入表项用于比对——剩余深度是局面的函数，比对它不会丢命中，但能防止
   「进攻搜索」（cfg.vctDepth 起步）与「rootFilter 防守搜索」（cfg.vctDefDepth 起步）
   两条起始预算不同的搜索线在同一局面上互相污染（它们共享同一张表，同一手 think() 内都跑）。
   中止污染：vctLimit/vctDeadline/lvl 上限撞到时返回的 0 不是证伪，绝不能存证伪条目，
   否则会把没搜完的局面永久标记成「安全」，产生假防守。用全局计数器 vctAbortMark 标记——
   进节点前记 mark，子树搜完后计数器没变才允许写证伪条目；证明（找到杀点）不受影响，
   随时可写，因为中止的子节点只会被当成「防住了」处理，不会让本节点错误地宣称找到杀点。
   证明条目命中后用前必须校验 board[m]===EMPTY 且确实是威胁点，防 20 位索引+32 位校验和
   仍会有的哈希碰撞把引擎带偏成一步垃圾「必胜」棋。
   生命周期：随 ttClear() 每步清空——跟置换率的测量口径一致（单步内 86%），
   ENG.clearHistory() 也走 ttClear()，跨局不会残留（det.js 的确定性台子依赖这一点）。 */
var VCT_TT_BITS=21, VCT_TT_SIZE=1<<VCT_TT_BITS, VCT_TT_MASK=VCT_TT_SIZE-1;
var vctTtKey=new Int32Array(VCT_TT_SIZE), vctTtSide=new Int8Array(VCT_TT_SIZE);
var vctTtDepth=new Int8Array(VCT_TT_SIZE), vctTtFlag=new Int8Array(VCT_TT_SIZE);
var vctTtMove=new Int32Array(VCT_TT_SIZE);
var vctAbortMark=0;
function vctTtClear(){ vctTtSide.fill(0); }
function vctTtIndex(side){ return (hash1^(side===BLACK?0x2f6e2b1d:0x7c9e6a3f))&VCT_TT_MASK; }

function forcingKind(side,q){        // 0=非强制 1=活三 2=冲四/活四 3=成五
  var P=side===BLACK?PB:PW, b=q*4, k, t, r=0;
  for(k=0;k<4;k++){
    t=P[b+k];
    if(t===P_FIVE) return 3;
    if(t===P_OFOUR||t===P_FOUR) r=2;
    else if(t===P_OTHREE&&r<2) r=1;
  }
  return r;
}
/* 返回防守着法数；-1 表示对方无法防守（进攻方直接获胜） */
function genDefense(side, m, w, lvl){
  var opp=3-side, base=lvl*32, n=0, i, k, j, q, d, t, dup;
  if(w===1){                                   // 我成了冲四：只能挡唯一成五点
    q=fpBuf[0];
    if(FORBID && opp===BLACK && isForbidden(q)) return -1;
    defBuf[base]=q; return 1;
  }
  var b=lvl*4;
  for(k=0;k<4;k++){                            // 我活三方向上的全部空点（用落子前的快照）
    if(patSave[b+k]!==P_OTHREE) continue;
    d=D[k];
    for(j=-4;j<=4;j++){
      if(j===0) continue;
      q=m+j*d;
      if(board[q]!==EMPTY) continue;
      if(FORBID && opp===BLACK && isForbidden(q)) continue;
      dup=0; for(i=0;i<n;i++) if(defBuf[base+i]===q){dup=1;break;}
      if(!dup&&n<32) defBuf[base+n++]=q;
    }
  }
  var PO=opp===BLACK?PB:PW;                    // 对方的反冲四（可反过来将我的军）
  for(i=0;i<225;i++){
    q=CELLS[i];
    if(board[q]!==EMPTY||adj[q]===0) continue;
    var bb=q*4, isf=0;
    for(k=0;k<4;k++){ t=PO[bb+k]; if(t===P_FOUR||t===P_OFOUR||t===P_FIVE){isf=1;break;} }
    if(!isf) continue;
    if(FORBID && opp===BLACK && isForbidden(q)) continue;
    dup=0; for(k=0;k<n;k++) if(defBuf[base+k]===q){dup=1;break;}
    if(!dup&&n<32) defBuf[base+n++]=q;
  }
  return n;
}
function vct(side, depth, lvl){
  if(++vctNodes>vctLimit){ vctAbortMark++; return 0; }
  if((vctNodes&255)===0 && nowMs()>vctDeadline){ vctAbortMark++; return 0; }
  if(lvl>=30){ vctAbortMark++; return 0; }
  var opp=3-side, i, k, q;
  if(fivePoints(side,1)>0) return fpBuf[0];
  if(depth<=0) return 0;
  var on=fivePoints(opp,2);
  if(on>=2) return 0;

  var d2=depth>127?127:depth, ti=vctTtIndex(side);
  if(vctTtSide[ti]===side && vctTtKey[ti]===hash2 && vctTtDepth[ti]===d2){
    var tf=vctTtFlag[ti];
    if(tf===1) return 0;
    if(tf===2){
      var hm=vctTtMove[ti];
      if(board[hm]===EMPTY && forcingKind(side,hm)!==0) return hm;
    }
  }
  var mark=vctAbortMark;
  var forced = on===1 ? fpBuf[0] : 0;         // 对方有冲四：我只能走那一点

  var S=side===BLACK?SB:SW, base=lvl*64, n=0, kind;
  for(i=0;i<225;i++){
    q=CELLS[i];
    if(board[q]!==EMPTY||adj[q]===0) continue;
    if(forced && q!==forced) continue;
    kind=forcingKind(side,q);
    if(kind===0) continue;
    if(FORBID && side===BLACK && isForbidden(q)) continue;
    if(n<64){ atkBuf[base+n]=q; atkSc[base+n]=kind*4000000+S[q]; n++; }
  }
  for(i=1;i<n;i++){                            // 冲四优先，其次按威胁分
    var mq=atkBuf[base+i], ms=atkSc[base+i], j=i-1;
    while(j>=0&&atkSc[base+j]<ms){ atkBuf[base+j+1]=atkBuf[base+j]; atkSc[base+j+1]=atkSc[base+j]; j--; }
    atkBuf[base+j+1]=mq; atkSc[base+j+1]=ms;
  }
  for(i=0;i<n;i++){
    q=atkBuf[base+i];
    var PS4=side===BLACK?PB:PW, sb=q*4, s4=lvl*4;
    patSave[s4]=PS4[sb]; patSave[s4+1]=PS4[sb+1]; patSave[s4+2]=PS4[sb+2]; patSave[s4+3]=PS4[sb+3];
    make(q,side);
    var res=0, w=fivePoints(side,2);
    if(w>=2) res=q;                            // 做成活四，挡不住
    else{
      var nd=genDefense(side,q,w,lvl);
      if(nd===-1) res=q;                       // 对方因禁手无法防守
      else if(nd>0){
        var all=1, dbase=lvl*32;
        for(k=0;k<nd;k++){
          var dm=defBuf[dbase+k];
          make(dm,opp);
          var r=vct(side,depth-1,lvl+1);
          unmake(dm,opp);
          if(!r){ all=0; break; }
        }
        if(all) res=q;
      }
    }
    unmake(q,side);
    if(res){
      vctTtKey[ti]=hash2; vctTtSide[ti]=side; vctTtDepth[ti]=d2;
      vctTtFlag[ti]=2; vctTtMove[ti]=res;
      return res;
    }
    if(vctNodes>vctLimit||nowMs()>vctDeadline){ vctAbortMark++; return 0; }
  }
  if(vctAbortMark===mark){
    vctTtKey[ti]=hash2; vctTtSide[ti]=side; vctTtDepth[ti]=d2;
    vctTtFlag[ti]=1; vctTtMove[ti]=0;
  }
  return 0;
}

/* ---------- 根节点 ---------- */
var rootN=0;
var rootMv=new Int32Array(32), rootSc=new Int32Array(32), rootBad=new Uint8Array(32);

function pvExtract(side, mv, maxLen){
  var pv=[mv], made=[[mv,side]], s=3-side, i, ti, m;
  make(mv,side);
  for(i=1;i<maxLen;i++){
    ti=ttIndex(s);
    if(ttSide[ti]!==s||ttKey[ti]!==hash2) break;
    m=ttMove[ti];
    if(!m||board[m]!==EMPTY) break;
    pv.push(m); make(m,s); made.push([m,s]); s=3-s;
  }
  for(i=made.length-1;i>=0;i--) unmake(made[i][0],made[i][1]);
  return pv;
}

function rootIteration(side, depth){
  var opp=3-side, alpha=-INF, beta=INF, best=-INF, bestI=-1, i, q, v;
  for(i=0;i<rootN;i++){
    if(rootBad[i]) continue;
    q=rootMv[i];
    make(q,side);
    if(bestI<0){
      v=-pvs(opp,depth-1,-beta,-alpha,1);
    }else{
      v=-pvs(opp,depth-1,-alpha-1,-alpha,1);
      if(!timeout && v>alpha) v=-pvs(opp,depth-1,-beta,-alpha,1);
    }
    unmake(q,side);
    if(timeout) break;
    rootSc[i]=v;
    if(v>best){ best=v; bestI=i; }
    if(v>alpha) alpha=v;
  }
  return bestI<0?-1:bestI;
}

function sortRoot(){
  var i,j,q,s,bd;
  for(i=1;i<rootN;i++){
    q=rootMv[i]; s=rootSc[i]; bd=rootBad[i]; j=i-1;
    while(j>=0&&rootSc[j]<s){ rootMv[j+1]=rootMv[j]; rootSc[j+1]=rootSc[j]; rootBad[j+1]=rootBad[j]; j--; }
    rootMv[j+1]=q; rootSc[j+1]=s; rootBad[j+1]=bd;
  }
}

function xy(p){ return {x:(p%W)-PAD, y:((p/W)|0)-PAD}; }

function think(side, cfg){
  FORBID=!!cfg.forbid;
  timeout=0; nodeCount=0;
  var start=nowMs();
  deadline=start+cfg.timeMs;

  if(stones===0) return {mv:CELLS[112], score:0, depth:0, nodes:0, ms:0, pv:[CELLS[112]], note:'开局'};

  /* 1. 直接成五 */
  if(fivePoints(side,1)>0) return {mv:fpBuf[0], score:WIN, depth:1, nodes:0, ms:nowMs()-start, pv:[fpBuf[0]], note:'成五'};
  /* 2. 挡对方成五 */
  var opp=3-side;
  if(fivePoints(opp,1)>0){
    var blk=fpBuf[0];
    if(!(FORBID&&side===BLACK&&isForbidden(blk)))
      return {mv:blk, score:0, depth:1, nodes:0, ms:nowMs()-start, pv:[blk], note:'挡五'};
  }
  /* 3. VCF 算杀 */
  if(cfg.vcfDepth>0){
    vcfNodes=0; vcfLimit=cfg.vcfBudget; vcfDeadline=start+cfg.timeMs*0.12;
    var w=vcf(side,cfg.vcfDepth);
    if(w) return {mv:w, score:WIN-10, depth:cfg.vcfDepth, nodes:vcfNodes, ms:nowMs()-start, pv:[w], note:'VCF 连四杀'};
  }
  /* 3b. VCT 连续威胁算杀（四三 / 双三），只分配约 35% 时间 */
  if(cfg.vctDepth>0){
    vctNodes=0; vctLimit=cfg.vctBudget; vctDeadline=start+cfg.timeMs*0.28;
    var wt=vct(side,cfg.vctDepth,0);
    if(wt) return {mv:wt, score:WIN-20, depth:cfg.vctDepth, nodes:vctNodes, ms:nowMs()-start, pv:[wt], note:'VCT 连续威胁杀'};
  }

  /* 4. 根走法 + 杀棋规避过滤 */
  ttClear(); killers.fill(0);
  for(var h=0;h<history.length;h++) history[h]=(history[h]/8)|0;

  var cnt=genMoves(side,0,0,26);
  if(genFlag===1) return {mv:mvBuf[0], score:WIN, depth:1, nodes:0, ms:nowMs()-start, pv:[mvBuf[0]], note:'成五'};
  if(cnt===0) return {mv:0, score:-WIN, depth:0, nodes:0, ms:nowMs()-start, pv:[], note:'无路可走'};
  rootN=cnt;
  for(var i=0;i<cnt;i++){ rootMv[i]=mvBuf[i]; rootSc[i]=-INF; rootBad[i]=0; }

  if(cfg.rootFilter && cnt>1){
    var goodLeft=cnt, lim=cnt<14?cnt:14;
    for(i=0;i<lim && goodLeft>1;i++){
      if(nowMs()>start+cfg.timeMs*0.45) break;
      make(rootMv[i],side);
      vcfNodes=0; vcfLimit=30000; vcfDeadline=start+cfg.timeMs*0.45;
      var lose=vcf(opp,10);
      if(!lose && cfg.vctDefDepth>0 && i<8){
        vctNodes=0; vctLimit=cfg.vctDefBudget; vctDeadline=start+cfg.timeMs*0.45;
        lose=vct(opp,cfg.vctDefDepth,0);
      }
      unmake(rootMv[i],side);
      if(lose){ rootBad[i]=1; goodLeft--; }
    }
    if(goodLeft<=0) for(i=0;i<cnt;i++) rootBad[i]=0;
  }

  /* 5. 迭代加深 */
  var bestMv=rootMv[0], bestSc=0, doneDepth=0, pv=[bestMv];
  var searchStart=nowMs(), remain=deadline-searchStart;
  for(var d=2; d<=cfg.maxDepth; d+=1){
    var bi=rootIteration(side,d);
    if(bi>=0 && (!timeout || d<=2)){
      bestMv=rootMv[bi]; bestSc=rootSc[bi]; doneDepth=d;
      pv=pvExtract(side,bestMv,10);
      if(typeof self!=='undefined'&&self.postMessage)
        self.postMessage({t:'info', depth:d, score:bestSc, nodes:nodeCount,
          ms:Math.round(nowMs()-start), pv:pv.map(xy)});
    }
    if(timeout) break;
    if(bestSc>=WIN-200||bestSc<=-(WIN-200)) break;
    if(nowMs()-searchStart > remain*0.45) break;
  }

  /* 6. 弱难度加入随机性 */
  if(cfg.rand>0 && Math.random()<cfg.rand){
    sortRoot();
    var top=rootN<4?rootN:4, pick=(Math.random()*top)|0;
    if(rootSc[pick]>-WIN+1000 && rootSc[pick]<WIN-1000 && rootSc[0]<NEARWIN) bestMv=rootMv[pick];
  }

  return {mv:bestMv, score:bestSc, depth:doneDepth, nodes:nodeCount,
          ms:Math.round(nowMs()-start), pv:pv, note:''};
}

/* ---------- 消息接口 ---------- */
self.onmessage=function(ev){
  var m=ev.data;
  if(m.t==='think'){
    reset();
    FORBID=!!m.cfg.forbid;
    for(var i=0;i<m.moves.length;i++){
      var p=(m.moves[i][1]+PAD)*W+(m.moves[i][0]+PAD);
      make(p, (i%2===0)?BLACK:WHITE);
    }
    var r=think(m.side, m.cfg);
    var c=xy(r.mv);
    self.postMessage({t:'best', x:c.x, y:c.y, score:r.score, depth:r.depth,
      nodes:r.nodes, ms:r.ms, note:r.note, forHint:!!m.forHint,
      pv:(r.pv||[]).map(xy)});
  }
};
self.postMessage({t:'ready'});
</script>

/* 引擎返回的 note 是写死的中文，而引擎源码要与实验台逐字节一致、不能改动，
   所以在显示层做映射。key 必须与 index.html 引擎段里的字面量完全一致。 */
const NOTE_EN={
  '开局':'Opening', '成五':'Five in a row', '挡五':'Blocking five',
  'VCF 连四杀':'VCF — forced-four win', 'VCT 连续威胁杀':'VCT — threat-sequence win',

};
function noteText(n){ return (LANG==='en' && NOTE_EN[n]) ? NOTE_EN[n] : n; }

let LANG = (function(){
  try{ const s=localStorage.getItem('gomoku.lang'); if(s==='zh'||s==='en') return s; }catch(e){}
  return (navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en';
})();
function t(k){ return I18N[LANG][k]; }
function applyLang(){
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  document.title = LANG==='zh' ? '五子棋 Gomoku · AI' : 'Gomoku · AI';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=I18N[LANG][el.dataset.i18n];
    if(v==null) return;
    // 文案里带 <code>/<b> 标记，只有这几处需要 innerHTML；其余走 textContent 更安全
    if(/[<]/.test(v)) el.innerHTML=v; else el.textContent=v;
  });
  document.getElementById('langBtn').textContent = LANG==='zh' ? 'EN' : '中文';
  if(typeof workerWarnEl!=='undefined' && workerWarnEl) workerWarnEl.innerHTML=t('workerWarn');
  if(typeof updateUI==='function'){
    updateUI(); refreshOverlayText();
    // 已经显示出来的「策略：…」也要跟着换语言，否则会留在旧语言
    if(!aiThinking) document.getElementById('think').textContent=
      (showAnalysis&&lastNote)?(t('strategy')+noteText(lastNote)):' ';
  }
}

const SZ=15;
let moves=[];            // [x,y] 按顺序，偶数下标为黑
let over=false, winLine=null, winner=0;
let mySide=1, aiThinking=false, autoPlay=false, hintCell=null;
/* 接管模式：开启后 AI 那一方也由你落子，AI 不再自动应手（「求助 AI」仍可用来看它的建议） */
let takeOver=false;
/* 引擎分析（评分/深度/主变化 + 策略提示）默认隐藏——主变化会直接剧透 AI 的算路 */
let showAnalysis=false, lastNote='';
let hoverCell=null;

/* ---- 引擎启动：优先 Worker，file:// 下失败则回退主线程 ---- */
let engine=null, engineReady=false, usingWorker=false;
const src=document.getElementById('engineSrc').textContent;

function onEngineMsg(m){
  if(m.t==='ready'){ engineReady=true; return; }
  if(m.t==='info'){ showInfo(m); return; }
  if(m.t==='best'){ onBest(m); return; }
}
function postToEngine(msg){
  if(usingWorker) engine.postMessage(msg);
  else setTimeout(()=>engine.onmessage({data:msg}),10);
}
try{
  const blob=new Blob([src],{type:'application/javascript'});
  const wk=new Worker(URL.createObjectURL(blob));
  wk.onmessage=e=>onEngineMsg(e.data);
  wk.onerror=()=>{};
  engine=wk; usingWorker=true;
}catch(e){ usingWorker=false; }
if(!usingWorker){
  const shim={onmessage:null, postMessage:m=>onEngineMsg(m)};
  (new Function('self',src))(shim);
  engine=shim;
}

/* ---------- 水粉背景 ----------
   地盘按胜率划分：AI 占优 -> 暖色（琥珀/橘）铺得多，你占优 -> 冷色（蓝/青/紫）铺得多。

   怎么做到「交界像混色」：每个色团都同时持有一个暖色和一个冷色，实际颜色由它在
   x 轴上相对分界线的位置插值而来，过渡带很宽（SOFT）。所以靠近分界的色团本身就是
   两色调和出来的中间色，而不是两块颜色硬拼在一起——这正是水粉湿画法的样子。

   性能：画布只有 ~1/5 分辨率，放大时的双线性插值顺带把色团揉软（省掉昂贵的全屏
   CSS blur）。重绘按需限速——静止时约 8fps、胜率变化时约 24fps，因为每次重绘都会
   让上面每块玻璃重算一次 backdrop（上一轮实测：不限速会把 60fps 打到 12fps）。 */
const BG=(function(){
  const el=document.getElementById('bg'), c=el.getContext('2d');
  const WARM=[[255,138,20],[255,72,36],[255,186,54],[255,102,48]];    // AI（高饱和）
  const COOL=[[28,120,255],[0,214,204],[142,64,255],[36,158,255]];    // 你（高饱和）
  // 底层横向渐变用的深色版本——负责把整幅背景铺满，色团只在它上面叠浓淡
  const WARM_BASE=[132,44,4], COOL_BASE=[12,44,128];
  const N=18, SOFT=0.34;                 // SOFT 越大，交界的调和带越宽
  const blobs=[];
  let seed=20260808;
  const rnd=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);
  for(let i=0;i<N;i++) blobs.push({
    bx:-0.15+rnd()*1.30, by:-0.1+rnd()*1.2, r:0.34+rnd()*0.34,
    fx:0.13+rnd()*0.30, fy:0.11+rnd()*0.28,   // 各自不同的漂移频率 -> 不会整体同步晃
    ph:rnd()*6.283, ax:0.09+rnd()*0.11, ay:0.07+rnd()*0.10,
    a:0.16+rnd()*0.14, pal:i%4,
  });

  let target=0.5, cur=0.5, t=0, W=0, H=0, last=0, raf=0, img=null;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  function resize(){
    // 1/5 分辨率就够——反正整幅图都是柔和过渡，放大后看不出来。
    // 上限 300x200：底层是逐像素画的，4K 屏下不封顶会白白多花好几倍。
    W=Math.min(300,Math.max(72,Math.round(window.innerWidth/5)));
    H=Math.min(200,Math.max(48,Math.round(window.innerHeight/5)));
    el.width=W; el.height=H;
    img=c.createImageData(W,H);      // 复用，避免每帧重新分配
    paint();
  }
  const smooth=x=>{ x=x<0?0:(x>1?1:x); return x*x*(3-2*x); };

  /* 分界线不是一条竖直线，而是随高度起伏、并随时间流动的曲线 x = edgeAt(y)。
     两个不同频率的正弦叠加，所以左右宽窄一路变化（这里多一点、那里少一点），像流体。
     关键：它对每个 y 只有一个取值，于是「曲线左边全是暖、右边全是冷」恒成立——
     两种颜色各自始终是连通的一整片，绝不会裂成互相分开的色块。 */
  function edgeAt(ny){
    return (-0.28+cur*1.66)
         + 0.105*Math.sin(ny*3.0 + t*0.62)
         + 0.062*Math.sin(ny*6.9 - t*0.41 + 1.9);
  }

  function paint(){
    // 底层逐像素画：分界既然是曲线，就没法用一条 createLinearGradient 表达了。
    // 画布很小（<=300x200），这点循环开销可以忽略。
    const d=img.data, dr=COOL_BASE[0]-WARM_BASE[0], dg=COOL_BASE[1]-WARM_BASE[1], db=COOL_BASE[2]-WARM_BASE[2];
    for(let yy=0;yy<H;yy++){
      const ny=yy/H, ey=edgeAt(ny);
      const vT=Math.max(0,(0.30-ny)/0.30), vB=Math.max(0,(ny-0.68)/0.32);
      const dark=1-0.34*vT*vT-0.42*vB*vB;      // 上下压暗，避免整幅平得像色卡
      let i=(yy*W)<<2;
      for(let xx=0;xx<W;xx++,i+=4){
        const m=smooth((xx/W-ey)/SOFT+0.5);
        d[i]  =(WARM_BASE[0]+dr*m)*dark;
        d[i+1]=(WARM_BASE[1]+dg*m)*dark;
        d[i+2]=(WARM_BASE[2]+db*m)*dark;
        d[i+3]=255;
      }
    }
    c.putImageData(img,0,0);
    c.globalCompositeOperation='screen';       // 深底上叠色，像层层罩染
    const R=Math.max(W,H);
    for(const b of blobs){
      const x=(b.bx+Math.sin(t*b.fx+b.ph)*b.ax);
      const y=(b.by+Math.cos(t*b.fy+b.ph*1.7)*b.ay);
      // 取自己所在高度上的分界值，才能和底层的波形对齐（行程超出画面两侧，
      // 否则一方 95% 时另一端仍会残留对方色团，「地盘被吃掉」的感觉出不来）
      const m=smooth((x-edgeAt(y))/SOFT+0.5);
      const wa=WARM[b.pal], co=COOL[b.pal];
      const r=Math.round(wa[0]+(co[0]-wa[0])*m),
            g=Math.round(wa[1]+(co[1]-wa[1])*m),
            bl=Math.round(wa[2]+(co[2]-wa[2])*m);
      const px=x*W, py=y*H, pr=b.r*R;
      const grd=c.createRadialGradient(px,py,0,px,py,pr);
      grd.addColorStop(0,   'rgba('+r+','+g+','+bl+','+b.a+')');
      grd.addColorStop(0.55,'rgba('+r+','+g+','+bl+','+(b.a*0.42).toFixed(3)+')');
      grd.addColorStop(1,   'rgba('+r+','+g+','+bl+',0)');
      c.fillStyle=grd;
      c.beginPath(); c.arc(px,py,pr,0,6.2832); c.fill();
    }
    c.globalCompositeOperation='source-over';
  }

  function frame(ts){
    raf=0;
    const moving=Math.abs(cur-target)>0.0015;
    // 限速：胜率变化时画顺一点，静止时慢慢飘就行
    const gap=moving?42:70;
    if(ts-last>=gap){
      const dt=(ts-last)/1000; last=ts;
      if(moving) cur+=(target-cur)*Math.min(1,dt*1.25);  // 指数趋近，起步快收尾缓（约 1.5s 洇满）
      else cur=target;
      if(!reduce) t+=dt*1.15;
      paint();
    }
    if(moving||!reduce) raf=requestAnimationFrame(frame);
  }
  function kick(){ if(!raf){ last=performance.now()-200; raf=requestAnimationFrame(frame); } }

  window.addEventListener('resize',resize);
  resize();
  if(!reduce) kick();
  return {
    /* p = AI 的胜率（0~1）。updateWinBar 每次算完都会喂进来。 */
    set(p){ if(Math.abs(p-target)<0.002) return; target=p; if(reduce){ cur=p; paint(); } else kick(); }
  };
})();

/* ---- 画布 ---- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let CELL=36, MARGIN=26, DPR=Math.min(window.devicePixelRatio||1,2);
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);   // 拖到不同 DPI 的显示器上也要跟着变
  const wide=window.innerWidth>=821;
  const byW=Math.min(window.innerWidth-28, wide?620:560);
  // 只按宽度算会让棋盘在横屏手机/矮窗口下顶出屏幕外，必须同时受高度约束。
  // 预留：宽屏是头部+胜率条；窄屏还要再留快捷操作条。
  const byH=window.innerHeight-(wide?150:250);
  const avail=Math.max(258, Math.min(byW, byH));
  CELL=Math.max(16, Math.floor((avail-2*22)/(SZ-1)));
  MARGIN=Math.round(CELL*0.78);
  const px=CELL*(SZ-1)+MARGIN*2;
  cv.style.width=px+'px'; cv.style.height=px+'px';
  cv.width=px*DPR; cv.height=px*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
const CX=i=>MARGIN+i*CELL;
const LETTERS='ABCDEFGHIJKLMNO';

function draw(){
  const px=CELL*(SZ-1)+MARGIN*2;
  const g=ctx.createLinearGradient(0,0,px,px);
  g.addColorStop(0,'#e2ab63'); g.addColorStop(.5,'#d69b52'); g.addColorStop(1,'#c68a42');
  ctx.fillStyle=g; ctx.fillRect(0,0,px,px);

  // 木纹
  ctx.save(); ctx.globalAlpha=.06; ctx.strokeStyle='#5c3a12'; ctx.lineWidth=1;
  for(let i=0;i<38;i++){
    ctx.beginPath();
    const y=(i*px/38);
    ctx.moveTo(0,y);
    ctx.bezierCurveTo(px*.3,y+Math.sin(i)*5,px*.7,y-Math.cos(i*1.7)*5,px,y);
    ctx.stroke();
  }
  ctx.restore();

  // 网格
  ctx.strokeStyle='rgba(60,35,10,.62)'; ctx.lineWidth=1;
  for(let i=0;i<SZ;i++){
    ctx.beginPath(); ctx.moveTo(CX(0),CX(i)); ctx.lineTo(CX(SZ-1),CX(i)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX(i),CX(0)); ctx.lineTo(CX(i),CX(SZ-1)); ctx.stroke();
  }
  ctx.lineWidth=2; ctx.strokeStyle='rgba(60,35,10,.8)';
  ctx.strokeRect(CX(0),CX(0),CELL*(SZ-1),CELL*(SZ-1));

  // 星位
  ctx.fillStyle='rgba(50,28,6,.85)';
  [[3,3],[11,3],[3,11],[11,11],[7,7]].forEach(([x,y])=>{
    ctx.beginPath(); ctx.arc(CX(x),CX(y),CELL*0.09,0,7); ctx.fill();
  });

  // 坐标
  ctx.fillStyle='rgba(60,35,10,.55)';
  ctx.font=`${Math.max(9,CELL*0.32)}px ui-monospace,monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<SZ;i++){
    ctx.fillText(LETTERS[i],CX(i),MARGIN*0.42);
    ctx.fillText(String(SZ-i),MARGIN*0.42,CX(i));
  }

  // 提示
  if(hintCell&&!over){
    ctx.strokeStyle='rgba(74,158,255,.95)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(CX(hintCell[0]),CX(hintCell[1]),CELL*0.44,0,7); ctx.stroke();
  }
  // 悬停
  if(hoverCell&&!over&&!aiThinking&&isEmpty(hoverCell[0],hoverCell[1])&&(turn()===mySide||takeOver)&&!autoPlay){
    ctx.globalAlpha=.32; drawStone(hoverCell[0],hoverCell[1],turn(),-1); ctx.globalAlpha=1;
  }

  // 棋子
  const showNums=numsOn;
  moves.forEach(([x,y],i)=>drawStone(x,y,i%2===0?1:2, showNums?i+1:0));

  // 最后一手：沿棋子外缘描环，避免与手数数字重叠
  if(moves.length&&!winLine){
    const [x,y]=moves[moves.length-1];
    ctx.strokeStyle='#e5484d'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.arc(CX(x),CX(y),CELL*0.46,0,7); ctx.stroke();
  }
  // 胜利连线
  if(winLine){
    ctx.strokeStyle='#e5484d'; ctx.lineWidth=CELL*0.13; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(CX(winLine[0][0]),CX(winLine[0][1]));
    ctx.lineTo(CX(winLine[1][0]),CX(winLine[1][1]));
    ctx.stroke(); ctx.lineCap='butt';
  }
}
function drawStone(x,y,c,num){
  const cx=CX(x),cy=CX(y),r=CELL*0.44;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy+r*0.14,r,0,7);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fill();
  const g=ctx.createRadialGradient(cx-r*0.35,cy-r*0.4,r*0.1,cx,cy,r*1.05);
  if(c===1){ g.addColorStop(0,'#6e6e75'); g.addColorStop(.45,'#26262b'); g.addColorStop(1,'#050506'); }
  else{ g.addColorStop(0,'#ffffff'); g.addColorStop(.5,'#f0f0ee'); g.addColorStop(1,'#bdbdb8'); }
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=c===1?'rgba(255,255,255,.10)':'rgba(0,0,0,.20)'; ctx.lineWidth=1; ctx.stroke();
  if(num>0){
    ctx.fillStyle=c===1?'rgba(255,255,255,.82)':'rgba(0,0,0,.7)';
    ctx.font=`600 ${Math.max(9,CELL*0.34)}px ui-monospace,monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(num),cx,cy+0.5);
  }
  ctx.restore();
}

/* ---- 规则 ---- */
function turn(){ return moves.length%2===0?1:2; }
function at(x,y){
  if(x<0||y<0||x>=SZ||y>=SZ) return 0;
  for(let i=0;i<moves.length;i++) if(moves[i][0]===x&&moves[i][1]===y) return i%2===0?1:2;
  return 0;
}
let grid=new Int8Array(SZ*SZ);
function rebuild(){ grid.fill(0); moves.forEach(([x,y],i)=>grid[y*SZ+x]=i%2===0?1:2); }
function gat(x,y){ return (x<0||y<0||x>=SZ||y>=SZ)?0:grid[y*SZ+x]; }
function isEmpty(x,y){ return gat(x,y)===0; }

function checkWin(x,y,c){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const [dx,dy] of dirs){
    let n=1,ax=x,ay=y,bx=x,by=y;
    while(gat(ax-dx,ay-dy)===c){ ax-=dx; ay-=dy; n++; }
    while(gat(bx+dx,by+dy)===c){ bx+=dx; by+=dy; n++; }
    if(forbidOn && c===1){ if(n===5) return [[ax,ay],[bx,by]]; }
    else if(n>=5) return [[ax,ay],[bx,by]];
  }
  return null;
}
// 界面侧的黑棋禁手判定（与引擎同规则的简化版）
function countShape(x,y,c,kind){
  // kind: 'four' 计冲四/活四方向数, 'open3' 计活三方向数, 'long' 是否长连
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  let four=0,open3=0,long=false,exact5=false;
  grid[y*SZ+x]=c;
  for(const [dx,dy] of dirs){
    let n=1,ax=x,ay=y,bx=x,by=y;
    while(gat(ax-dx,ay-dy)===c){ ax-=dx; ay-=dy; n++; }
    while(gat(bx+dx,by+dy)===c){ bx+=dx; by+=dy; n++; }
    if(n>=6) long=true;
    else if(n===5) exact5=true;
    else{
      // 冲四 / 活四：在该方向的空点上再放一子能成五
      let cnt4=0, cnt3=0;
      for(let k=-4;k<=4;k++){
        const px=x+dx*k, py=y+dy*k;
        if(px<0||py<0||px>=SZ||py>=SZ) continue;
        if(gat(px,py)!==0) continue;
        grid[py*SZ+px]=c;
        let m=1,cx2=px,cy2=py,dx2=px,dy2=py;
        while(gat(cx2-dx,cy2-dy)===c){ cx2-=dx; cy2-=dy; m++; }
        while(gat(dx2+dx,dy2+dy)===c){ dx2+=dx; dy2+=dy; m++; }
        if(m>=5) cnt4++;
        grid[py*SZ+px]=0;
      }
      if(cnt4>=1) four++;
      else{
        // 活三：某空点可成活四（两个成五点）
        for(let k=-4;k<=4;k++){
          const px=x+dx*k, py=y+dy*k;
          if(px<0||py<0||px>=SZ||py>=SZ) continue;
          if(gat(px,py)!==0) continue;
          grid[py*SZ+px]=c;
          let w=0;
          for(let k2=-5;k2<=5;k2++){
            const qx=x+dx*k2, qy=y+dy*k2;
            if(qx<0||qy<0||qx>=SZ||qy>=SZ) continue;
            if(gat(qx,qy)!==0) continue;
            grid[qy*SZ+qx]=c;
            let m2=1,ex=qx,ey=qy,fx=qx,fy=qy;
            while(gat(ex-dx,ey-dy)===c){ ex-=dx; ey-=dy; m2++; }
            while(gat(fx+dx,fy+dy)===c){ fx+=dx; fy+=dy; m2++; }
            if(m2>=5) w++;
            grid[qy*SZ+qx]=0;
          }
          grid[py*SZ+px]=0;
          if(w>=2){ cnt3++; break; }
        }
        if(cnt3) open3++;
      }
    }
  }
  grid[y*SZ+x]=0;
  return {four,open3,long,exact5};
}
function uiForbidden(x,y){
  if(!forbidOn) return false;
  const r=countShape(x,y,1);
  if(r.exact5) return false;
  if(r.long) return true;
  if(r.four>=2) return true;
  if(r.open3>=2) return true;
  return false;
}

/* ---- 交互 ---- */
function evtCell(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  const x=Math.round((t.clientX-r.left-MARGIN)/CELL);
  const y=Math.round((t.clientY-r.top-MARGIN)/CELL);
  if(x<0||y<0||x>=SZ||y>=SZ) return null;
  return [x,y];
}
cv.addEventListener('mousemove',e=>{
  const c=evtCell(e);
  if(!c!==!hoverCell || (c&&hoverCell&&(c[0]!==hoverCell[0]||c[1]!==hoverCell[1]))){ hoverCell=c; draw(); }
});
cv.addEventListener('mouseleave',()=>{ hoverCell=null; draw(); });
cv.addEventListener('click',e=>{
  const c=evtCell(e); if(!c) return;
  humanPlay(c[0],c[1]);
});

function humanPlay(x,y){
  if(over||aiThinking||autoPlay) return;
  if(turn()!==mySide && !takeOver) return;
  if(!isEmpty(x,y)) return;
  const wasAiTurn = turn()!==mySide;
  place(x,y);
  // 接管中不自动应手；替 AI 落完子后也停下，把控制权交还给你
  if(!over && !takeOver && !wasAiTurn) setTimeout(aiMove,120);
}

function place(x,y){
  const c=turn();
  hintCell=null;
  if(forbidOn && c===1 && uiForbidden(x,y)){
    moves.push([x,y]); rebuild();
    endGame(2,'forbidLoss',null); draw(); return;
  }
  moves.push([x,y]); rebuild();
  const line=checkWin(x,y,c);
  if(line){ endGame(c,null,line); }
  else if(moves.length>=SZ*SZ) endGame(0,'draw',null);
  updateUI(); draw();
}

/* 结束语存的是文案 key 而不是成品字符串——否则切换语言时终局弹窗会留在旧语言 */
let overMsgKey=null;
function refreshOverlayText(){
  if(!over) return;
  const w=winner;
  document.getElementById('ovt').textContent =
    w===0?t('draw'):(w===mySide&&!autoPlay?t('youWin'):(w===1?t('blackWins'):t('whiteWins')));
  document.getElementById('ovs').textContent =
    overMsgKey ? t(overMsgKey) : t('fiveBy')(w===1?t('black'):t('white'));
}
function endGame(w,msgKey,line){
  over=true; winner=w; winLine=line; autoPlay=false; setSw('auto',false);
  overMsgKey=msgKey;
  refreshOverlayText();
  document.getElementById('ov').classList.add('on');
  updateUI(); updateWinBar(); draw();
}

/* ---- AI ---- */
const LEVELS={
  1:{timeMs:200,  maxDepth:2,  vcfDepth:0,  vcfBudget:0,      vctDepth:0, vctBudget:0,      vctDefDepth:0, vctDefBudget:0,     rand:0.55, rootFilter:false},
  2:{timeMs:600,  maxDepth:4,  vcfDepth:6,  vcfBudget:20000,  vctDepth:0, vctBudget:0,      vctDefDepth:0, vctDefBudget:0,     rand:0.18, rootFilter:false},
  /* VCT 在各档「出厂配置」下经确定性 A/B 实测均为中性：3 档 24:24（48局）、4 档 12:12（24局），
     5 档未测。故全部保持原值。（旧记录里「VCT 净负 4:8」已证实是噪声，见 PROGRESS） */
  3:{timeMs:1500, maxDepth:8,  vcfDepth:10, vcfBudget:120000, vctDepth:5, vctBudget:80000,  vctDefDepth:0, vctDefBudget:0,     rand:0,    rootFilter:false},
  4:{timeMs:4000, maxDepth:12, vcfDepth:14, vcfBudget:400000, vctDepth:7, vctBudget:400000, vctDefDepth:5, vctDefBudget:60000, rand:0,    rootFilter:true},
  5:{timeMs:9000, maxDepth:18, vcfDepth:20, vcfBudget:1200000,vctDepth:9, vctBudget:1500000,vctDefDepth:7, vctDefBudget:150000,rand:0,    rootFilter:true}
};
function cfg(){
  const lv=+document.getElementById('level').value;
  const c=Object.assign({},LEVELS[lv]);
  if(lv>=3) c.timeMs=(+document.getElementById('time').value)*1000;
  // 回退到主线程时搜索会阻塞页面，限制单步耗时以免看起来像卡死
  if(!usingWorker){
    c.timeMs=Math.min(c.timeMs,3000);
    c.vcfBudget=Math.min(c.vcfBudget,150000);
  }
  c.forbid=forbidOn;
  return c;
}
let lastThinkSide=0;
function aiMove(forHint){
  if(over||aiThinking) return;
  aiThinking=true; lastThinkSide=turn(); updateUI();
  document.getElementById('think').textContent=t('aiThinkingDots');
  postToEngine({t:'think', moves:moves, side:lastThinkSide, cfg:cfg(), forHint:!!forHint});
}
function onBest(m){
  aiThinking=false;
  showInfo(m);
  lastNote=m.note||'';
  document.getElementById('think').textContent = (showAnalysis&&m.note)?(t('strategy')+noteText(m.note)):' ';
  if(m.forHint){ hintCell=[m.x,m.y]; updateUI(); draw(); return; }
  if(over) { updateUI(); return; }
  place(m.x,m.y);
  if(!over && autoPlay) setTimeout(aiMove,260);
  else updateUI();
}
/* ---- 胜率条 ----
   引擎返回的 score 始终是「请求方（lastThinkSide）」的视角：
   AI 走子时是 AI 视角，点「求助 AI」时是你的视角，必须按归属换算。 */
let lastScore=null, lastScoreSide=0;
/* K 由 14 局自战、296 个样本最小二乘拟合得出（评分 -> 实际胜负相关性）。
   凭感觉取的 22000 过度自信：评分 <-4万 时它预测 3% 胜率，实测有 24%。 */
const WP_K=43500;
function winProb(s){
  // 只有搜索证实的杀棋才给 0/100；启发式的「近赢」分数最多到 98%，不冒充确定性
  if(s>=9000000-1000) return 1;
  if(s<=-(9000000-1000)) return 0;
  const p=1/(1+Math.exp(-s/WP_K));
  return p<0.02?0.02:(p>0.98?0.98:p);
}
function updateWinBar(){
  const leftSide  = autoPlay ? 1 : 3-mySide;   // 左端：AI（自战时为黑方）
  const rightSide = 3-leftSide;
  document.getElementById('wbAiName').textContent = autoPlay?t('wbAiBlack'):t('wbAI');
  document.getElementById('wbMeName').textContent = autoPlay?t('wbAiWhite'):t('wbYou');
  let p;
  if(over){
    p = winner===0?0.5:(winner===leftSide?1:0);
  }else if(lastScore===null){
    p = 0.5;
  }else{
    p = winProb(lastScore);
    if(lastScoreSide!==leftSide) p = 1-p;      // 换算到左端视角
  }
  BG.set(p);                    // 背景地盘跟着胜率走（左端=AI=暖色）
  const l=Math.round(p*100);
  document.getElementById('wbFill').style.width = l+'%';
  document.getElementById('wbAi').textContent = l+'%';
  document.getElementById('wbMe').textContent = (100-l)+'%';
  document.getElementById('wbNote').textContent =
    over ? (winner===0?t('draw'):t('endgame')) : (aiThinking?t('calculating'):t('winrate'));
  document.getElementById('wbox').classList.toggle('busy', aiThinking&&!over);
}

function showInfo(m){
  const s=m.score;
  let txt;
  if(s>=9000000-300) txt=t('aiSureWin');
  else if(s<=-(9000000-300)) txt=t('aiSureLose');
  else txt=(s>0?'+':'')+s;
  document.getElementById('sScore').textContent=txt;
  document.getElementById('sDepth').textContent=t('plies')(m.depth);
  document.getElementById('sNodes').textContent=(m.nodes||0).toLocaleString();
  document.getElementById('sTime').textContent=((m.ms||0)/1000).toFixed(2)+' s';
  document.getElementById('sNps').textContent=
    m.ms>0?Math.round((m.nodes||0)/(m.ms/1000)/1000)+'k/s':'—';
  lastScore=s; lastScoreSide=lastThinkSide; updateWinBar();
  if(m.pv&&m.pv.length)
    document.getElementById('sPv').textContent=
      m.pv.slice(0,6).map(p=>LETTERS[p.x]+(SZ-p.y)).join(' ');
}

/* ---- 控件 ---- */
let numsOn=true, forbidOn=false;
function setSw(id,v){
  const el=document.getElementById(id);
  el.classList.toggle('on',v);
  el.setAttribute('aria-checked', v?'true':'false');
}
// 开关是 div，键盘用户要靠这个才能操作（HTML 里已给 role=switch + tabindex）
document.querySelectorAll('.sw').forEach(sw=>{
  sw.addEventListener('keydown',e=>{
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); sw.click(); }
  });
});

/* ---- 交互动效 ---- */
const REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

// 按钮涟漪：把按下点写进 CSS 变量，重启动画（先摘 class 再强制回流，否则连点第二下不触发）
document.addEventListener('pointerdown',e=>{
  const btn=e.target.closest('button');
  if(!btn||btn.disabled||REDUCE) return;
  const r=btn.getBoundingClientRect();
  btn.style.setProperty('--rx',(e.clientX-r.left)+'px');
  btn.style.setProperty('--ry',(e.clientY-r.top)+'px');
  btn.classList.remove('rip'); void btn.offsetWidth; btn.classList.add('rip');
},{passive:true});

/* 原生 details 不能给高度做过渡，接管点击用 WAAPI 自己动。
   仍然通过设置 .open 来切换，所以 toggle 事件、键盘操作、语义都保持不变。 */
document.querySelectorAll('details.card').forEach(d=>{
  const sum=d.querySelector('summary'), body=d.querySelector('.body');
  if(!sum||!body) return;
  let anim=null;
  sum.addEventListener('click',e=>{
    e.preventDefault();
    if(REDUCE){ d.open=!d.open; return; }
    if(anim) anim.cancel();
    const opening=!d.open;
    if(opening) d.open=true;                    // 先展开才量得到自然高度
    const h=body.scrollHeight;
    body.style.overflow='hidden';
    anim=body.animate(
      opening ? [{height:0,opacity:0},{height:h+'px',opacity:1}]
              : [{height:h+'px',opacity:1},{height:0,opacity:0}],
      {duration:opening?300:240, easing:opening?'cubic-bezier(.25,.9,.3,1)':'cubic-bezier(.4,0,.65,1)'}
    );
    anim.onfinish=()=>{
      anim=null; body.style.overflow='';
      if(!opening) d.open=false;                // 收起动画放完再真正关闭
    };
  });
});
document.getElementById('nums').onclick=function(){ numsOn=!numsOn; setSw('nums',numsOn); draw(); };
document.getElementById('forbid').onclick=function(){ forbidOn=!forbidOn; setSw('forbid',forbidOn); };
// 分析卡改成原生 details，展开状态由浏览器管，这里只同步「策略提示」的显隐
document.getElementById('anaCard').addEventListener('toggle',function(){
  showAnalysis=this.open;
  if(!aiThinking) document.getElementById('think').textContent=(showAnalysis&&lastNote)?(t('strategy')+noteText(lastNote)):' ';
});
document.getElementById('langBtn').onclick=function(){
  LANG = LANG==='zh' ? 'en' : 'zh';
  try{ localStorage.setItem('gomoku.lang',LANG); }catch(e){}
  applyLang();
};
document.getElementById('take').onclick=function(){
  takeOver=!takeOver; setSw('take',takeOver);
  // 关掉接管时，若正轮到 AI，让它立刻接手
  if(!takeOver && !over && !aiThinking && !autoPlay && turn()!==mySide) setTimeout(aiMove,120);
  updateUI(); draw();
};
document.getElementById('auto').onclick=function(){
  autoPlay=!autoPlay; setSw('auto',autoPlay);
  if(autoPlay&&!over&&!aiThinking) aiMove();
  updateUI(); updateWinBar();
};
document.getElementById('time').oninput=function(){
  document.getElementById('tval').textContent=(+this.value).toFixed(1)+'s';
};
document.getElementById('side').onchange=newGame;
document.getElementById('level').onchange=function(){
  const lv=+this.value;
  document.getElementById('time').value=Math.round(LEVELS[lv].timeMs/1000)||1;
  document.getElementById('time').dispatchEvent(new Event('input'));
};

function stopAuto(){ autoPlay=false; setSw('auto',false); updateUI(); }
function undo(){
  if(aiThinking||autoPlay) return;
  if(!moves.length) return;
  moves.pop();
  // 接管时两方都是你在走，一次只退一手
  if(!takeOver && moves.length && turn()!==mySide) moves.pop();
  over=false; winner=0; winLine=null; hintCell=null;
  document.getElementById('ov').classList.remove('on');
  lastScore=null;
  rebuild(); updateUI(); updateWinBar(); draw();
}
function hint(){
  if(over||aiThinking||autoPlay) return;
  aiMove(true);
}
function newGame(){
  moves=[]; over=false; winner=0; winLine=null; hintCell=null; hoverCell=null;
  mySide=+document.getElementById('side').value;
  document.getElementById('ov').classList.remove('on');
  ['sScore','sDepth','sNodes','sNps','sTime','sPv'].forEach(i=>document.getElementById(i).textContent='—');
  document.getElementById('think').innerHTML='&nbsp;';
  lastScore=null; lastScoreSide=0;
  rebuild(); updateUI(); updateWinBar(); draw();
  if(mySide===2 && !takeOver) setTimeout(aiMove,300);
}
function updateUI(){
  const cur=turn();                     // 注意：别叫 t，会遮蔽 i18n 的 t()
  const col=cur===1?t('black'):t('white');
  document.getElementById('turnDot').className='dot '+(cur===1?'b':'w');
  let txt;
  if(over) txt = winner===0?t('draw'):(winner===1?t('blackWins'):t('whiteWins'));
  else if(aiThinking) txt=t('aiThinking');
  else if(autoPlay) txt=t('turnAuto')(col);
  else if(takeOver&&cur!==mySide) txt=t('turnTake')(col);
  else txt=(cur===mySide?t('turnYou'):t('turnAI'))(col);
  document.getElementById('turnTxt').textContent=txt;
  const noUndo=aiThinking||autoPlay||!moves.length, noHint=aiThinking||autoPlay||over;
  document.getElementById('btnUndo').disabled=noUndo;
  document.getElementById('btnHint').disabled=noHint;
  document.getElementById('btnStop').disabled=!autoPlay;
  const ml=document.getElementById('mlist');
  ml.innerHTML = moves.length
    ? moves.map(([x,y],i)=>`<i>${i+1}.</i>${i%2===0?'●':'○'}${LETTERS[x]}${SZ-y}`).join('  ')
    : '—';
  ml.scrollTop=ml.scrollHeight;
  updateWinBar();
}
document.addEventListener('keydown',e=>{
  // 焦点在输入控件上时不抢快捷键（否则选难度时按 N 会莫名其妙开新局）
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='select'||tag==='input'||tag==='textarea'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='u'||e.key==='U') undo();
  if(e.key==='n'||e.key==='N') newGame();
  if(e.key==='h'||e.key==='H') hint();
});
let workerWarnEl=null;
if(!usingWorker){
  workerWarnEl=document.createElement('div');
  workerWarnEl.className='tip';
  workerWarnEl.style.marginTop='8px';
  workerWarnEl.style.color='var(--acc)';
  workerWarnEl.innerHTML=t('workerWarn');
  document.getElementById('tipBox').appendChild(workerWarnEl);
}
// 窄屏默认收起设置卡——展开的话棋盘下面要滚很久才够得到「新局/悔棋」。
// 只在首屏按宽度决定一次，之后尊重用户自己的展开/收起。
if(window.innerWidth<821) document.getElementById('setCard').open=false;

window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,120));
applyLang(); layout(); newGame();
</script>
</body>
</html>
